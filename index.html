<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="">
<title>Flood City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }

  /* ─── HUD ────────────────────────────────────────────── */
  #hud {
    position: fixed; top: 20px; left: 20px;
    z-index: 10; pointer-events: none;
    background: rgba(10,15,30,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 16px 20px;
    min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: none;
  }
  #hud.visible { display: block; }
  #hud h1 {
    font-size: 1.5em; font-weight: 700; margin: 0 0 10px;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #64b5f6, #42a5f5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #hud .stat {
    font-size: 0.95em; margin: 4px 0;
    color: #c0c8d8;
    display: flex; justify-content: space-between; gap: 12px;
  }
  #hud .stat span {
    font-weight: 700; color: #ffd54f;
    font-variant-numeric: tabular-nums;
  }
  #hud .warning { color: #ff8a65 !important; }

  #message {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: white; font-size: 2.5em; font-weight: 800; z-index: 20;
    text-align: center; pointer-events: none;
    text-shadow: 0 0 40px rgba(0,0,0,0.9), 0 4px 8px rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 0.4s;
    letter-spacing: 1px;
  }
  #message.show { opacity: 1; }

  #controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.55); font-size: 0.82em;
    z-index: 10; pointer-events: none; text-align: center;
    background: rgba(10,15,30,0.6); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 18px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    display: none;
  }
  #controls.visible { display: block; }
  #controls kbd {
    background: rgba(255,255,255,0.1);
    padding: 2px 7px; border-radius: 4px; margin: 0 2px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* ─── Game Over buttons ───────────────────────────────── */
  #gameover-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, 80px);
    z-index: 25; display: none; flex-direction: column; gap: 12px;
    align-items: center;
  }
  #gameover-panel.visible { display: flex; }
  #gameover-panel button {
    padding: 14px 40px; font-size: 1.15em;
    color: white; border: none; border-radius: 10px; cursor: pointer;
    font-weight: 700;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
    width: 260px;
  }
  #gameover-panel button:hover { transform: scale(1.06); }
  #restart-btn {
    background: linear-gradient(135deg, #ff6b35, #e55d2b);
    box-shadow: 0 4px 24px rgba(255,107,53,0.5);
  }
  #menu-btn {
    background: linear-gradient(135deg, #5c6bc0, #3f51b5);
    box-shadow: 0 4px 24px rgba(92,107,192,0.5);
  }

  /* ─── Home screen ─────────────────────────────────────── */
  #home-screen {
    position: fixed; inset: 0;
    z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(5,8,20,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  #home-screen.hidden { display: none; }
  #home-screen h2 {
    font-size: 3em; font-weight: 800; margin-bottom: 8px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #64b5f6, #42a5f5, #1e88e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }
  #home-screen .subtitle {
    color: rgba(255,255,255,0.45); font-size: 1em;
    margin-bottom: 40px; letter-spacing: 1px;
  }
  #map-cards {
    display: flex; gap: 20px; flex-wrap: wrap;
    justify-content: center; max-width: 700px;
  }
  .map-card {
    background: rgba(15,20,40,0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 28px 24px;
    width: 280px; cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .map-card:hover {
    transform: translateY(-4px);
    border-color: rgba(100,180,255,0.5);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(66,165,245,0.15);
  }
  .map-card h3 {
    font-size: 1.3em; color: #e0e8f0; margin-bottom: 6px;
    font-weight: 700;
  }
  .map-card .diff {
    font-size: 0.85em; color: #8ab4f8; margin-bottom: 10px;
  }
  .map-card .desc {
    font-size: 0.9em; color: #a0a8b8; line-height: 1.4;
  }
  .map-card .hint {
    margin-top: 12px; font-size: 0.75em; color: rgba(255,255,255,0.3);
    font-style: italic;
  }

  @keyframes alertFlash {
    0%, 100% { box-shadow: inset 0 0 0 rgba(255,0,0,0); }
    50% { box-shadow: inset 0 0 60px rgba(255,0,0,0.4); }
  }

  /* ─── Version display ─────────────────────────────────── */
  #home-version {
    margin-top: 28px;
    font-size: 0.75em;
    color: rgba(255,255,255,0.25);
    text-align: center;
    letter-spacing: 1px;
  }
  .hud-ver-stat {
    border-top: 1px solid rgba(255,255,255,0.08) !important;
    padding-top: 6px !important;
    margin-top: 2px !important;
    font-size: 0.8em !important;
    color: rgba(255,255,255,0.3) !important;
  }
  .hud-ver-stat span { color: rgba(255,255,255,0.35) !important; font-weight: 400 !important; }

  /* ─── Version update banner ──────────────────────────── */
  #version-banner {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 30;
    background: rgba(10,15,30,0.8);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 16px 20px;
    max-width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
    display: none;
  }
  #version-banner.visible {
    display: block;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #version-banner .vb-title {
    font-size: 0.9em; font-weight: 700;
    color: #ffd54f; margin-bottom: 4px;
  }
  #version-banner .vb-version {
    font-size: 0.8em; color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
  }
  #version-banner .vb-notes {
    font-size: 0.82em; color: #c0c8d8;
    margin-bottom: 12px; line-height: 1.3;
  }
  #version-banner .vb-actions {
    display: flex; gap: 8px; align-items: center;
  }
  #version-banner .vb-reload {
    padding: 8px 20px;
    background: linear-gradient(135deg, #42a5f5, #1e88e5);
    color: white; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 700; font-size: 0.85em;
    transition: transform 0.15s;
  }
  #version-banner .vb-reload:hover { transform: scale(1.05); }
  #version-banner .vb-close {
    background: none; border: none;
    color: rgba(255,255,255,0.4); font-size: 1.3em;
    cursor: pointer; padding: 4px 8px;
    line-height: 1; transition: color 0.2s;
  }
  #version-banner .vb-close:hover { color: rgba(255,255,255,0.8); }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Version ──────────────────────────────────────────────────
const GAME_VERSION = "2026.07.006";
document.querySelector("meta[name=version]").setAttribute("content", GAME_VERSION);
document.getElementById('home-version').textContent = 'v' + GAME_VERSION;
document.getElementById('hud-version').textContent = 'v' + GAME_VERSION;
console.log("Flood City v" + GAME_VERSION);

// ─── Version update checker ──────────────────────────────────
// Polls version.json periodically. Shows a dismissible banner
// when the deployed version differs from the loaded version.
// Never interrupts gameplay — the player chooses when to reload.

let _dismissedVersion = null;
let _lastVersionCheck = 0;
const VERSION_CHECK_INTERVAL = 5 * 60 * 1000; // 5 minutes
const FIRST_CHECK_DELAY = 60 * 1000;           // first check after 60 s

const $vb = document.getElementById('version-banner');

$vb.querySelector('.vb-reload').addEventListener('click', () => {
  // Force bypass browser cache on reload
  location.reload(true);
});

$vb.querySelector('.vb-close').addEventListener('click', () => {
  _dismissedVersion = $vb.dataset.version || null;
  $vb.classList.remove('visible');
});

async function checkVersion() {
  try {
    // Cache-busting: timestamp query param + no-cache headers
    const url = 'version.json?t=' + Date.now();
    const res = await fetch(url, {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    });
    if (!res.ok) return;                        // 404 etc → silent
    const data = await res.json();
    if (!data || typeof data.version !== 'string') return; // invalid → silent
    if (data.version !== GAME_VERSION && data.version !== _dismissedVersion) {
      $vb.dataset.version = data.version;
      $vb.querySelector('.vb-version').textContent = 'v' + data.version;
      $vb.querySelector('.vb-notes').textContent = data.notes || '';
      $vb.classList.add('visible');
    }
  } catch (_) {
    // Network error / parse error → silent, retry next cycle
  }
}

let _versionTimer = null;

function scheduleVersionCheck(delay) {
  clearTimeout(_versionTimer);
  _versionTimer = setTimeout(() => {
    if (!document.hidden) {
      checkVersion();
      _lastVersionCheck = Date.now();
    }
    scheduleVersionCheck(VERSION_CHECK_INTERVAL);
  }, delay);
}

// Resume checking when the tab becomes visible again
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - _lastVersionCheck > VERSION_CHECK_INTERVAL) {
    checkVersion();
    _lastVersionCheck = Date.now();
    scheduleVersionCheck(VERSION_CHECK_INTERVAL);
  }
});

// Start the cycle
scheduleVersionCheck(FIRST_CHECK_DELAY);

// ─── DOM refs ──────────────────────────────────────────────

const $mapCards = document.getElementById('map-cards');
const $hud = document.getElementById('hud');

// ─── Three.js setup ─────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 70);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 150);
camera.position.set(22, 18, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Controls

controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI / 2 + 0.3;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.update();

// ─── Lighting ───────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x8899cc, 1.2);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 3.5);
sun.position.set(30, 40, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = -35; sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35; sun.shadow.camera.bottom = -35;
sun.shadow.bias = -0.0004;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3d5a3d, 0.6);
scene.add(hemi);

// ─── Disposal helper ────────────────────────────────────────
function disposeGroup(group) {
  group.traverse(c => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
  group.clear();
}

// ─── MAPS REGISTRY ──────────────────────────────────────────
const MAPS = {
  littoral: {
    name: 'Littoral',
    description: 'Une ville côtière avec une large plage au sud. Les vagues arrivent depuis l\'océan — un seul front à défendre.',
    difficulty: '⭐ Facile',
    difficultyStars: 1,

    beachRoadZ: -11,

    // Ocean (near, animated) — position computed from beach params, not hardcoded
    oceanWidth: 48,
    oceanDepth: 14,
    // Wave config
    waveDirections: ['south'],
    waveSpawnZ: { south: -20 },
    // Roads
    roads: [
      { x1: -8, z1: -12, x2: -8, z2: 17 },
      { x1: 3, z1: -12, x2: 3, z2: 17 },
      { x1: -17, z1: -4, x2: 17, z2: -4 },
      { x1: -17, z1: 5, x2: 17, z2: 5 },
      { x1: -17, z1: -11, x2: 17, z2: -11 },
    ],
    // Intersections for crosswalks (computed from road crossings)
  },
  ile: {
    name: 'Île',
    description: 'Une île entourée d\'eau sur tous les côtés. Les vagues arrivent alternativement du nord ou du sud — défendez sur deux fronts !',
    difficulty: '⭐⭐ Moyen',
    difficultyStars: 2,
    terrainHalf: 12,
    islandRadius: 10.5,
    groundColor: 0x6a9e48,
    // Coastline params (ring beach around island)
    beachInnerR: 10.5,
    beachOuterR: 13,
    // Buildable zone (checked against circle x²+z² <= islandRadius²)
    buildXMin: -10,
    buildXMax: 10,
    buildZMin: -10,
    buildZMax: 10,
    // Wave config
    waveDirections: ['north', 'south'],
    waveSpawnZ: { south: -13, north: 13 },
    // Roads (compact grid within island)
    roads: [
      { x1: -5, z1: -12, x2: -5, z2: 12 },
      { x1: 2, z1: -12, x2: 2, z2: 12 },
      { x1: -12, z1: -3, x2: 12, z2: -3 },
      { x1: -12, z1: 4, x2: 12, z2: 4 },
    ],
  }
};

// Helper to check if a point is within an island's buildable circle
function isOnIsland(px, pz, map) {
  if (!map.islandRadius) return true; // not an island
  return (px * px + pz * pz) <= map.islandRadius * map.islandRadius;
}

// ─── Map content group (ALL map objects go here) ────────────
let mapGroup = new THREE.Group();
scene.add(mapGroup);

// City sub-group (buildings, roads, trees, cars, peds, beach items)
let cityGroup = new THREE.Group();
mapGroup.add(cityGroup);

// Ocean planes group
let oceanGroup = new THREE.Group();
mapGroup.add(oceanGroup);

// ─── Shared data ────────────────────────────────────────────
const WALL_COST = 10; // unused, kept for reference
const RESOURCE_REGEN = 1.0;
const RESOURCE_CAP = 300;
const WAVE_INTERVAL_MIN = 14;
const WAVE_INTERVAL_MAX = 22;

const WALL_TIERS = {
  1: { name: 'Sac de sable', cost: 10, hp: 100, color: 0xd4b896, geoH: 0.55 },
  2: { name: 'Renforcé', cost: 25, hp: 300, color: 0x8b7355, geoH: 0.7 },

};
const TRENCH_COST = 5;
const TRENCH_DAMAGE = 8;
const TRENCH_HP = 40;

let currentMap = null;
let resources = 150;
let score = 0;
let buildings = [];
let walls = [];

let oceanPlanes = []; // animated ocean meshes

const BUILDING_COLORS = [
  0xe8c9a0, 0xdbb88c, 0xd4a574, 0xc4956a, 0xf0dcc0,
  0xa8c8e8, 0x90b8d8, 0xb8d4f0, 0x7aa8c8, 0xc0ddf0,
  0xe0d0b8, 0xd4c4a8, 0xc8b898, 0xecdcc4, 0xdcc8a8,

// ─── Window texture generator ───────────────────────────────
function createWindowTexture(baseColor) {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  const r = (baseColor >> 16) & 0xff;
  const g = (baseColor >> 8) & 0xff;
  const b = baseColor & 0xff;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, size, size);

  const cols = 4, rows = 6;
  const marginX = 8, marginY = 6;
  const cellW = (size - marginX * 2) / cols;
  const cellH = (size - marginY * 2) / rows;

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const wx = marginX + col * cellW + cellW * 0.15;
      const wy = marginY + row * cellH + cellH * 0.15;
      const ww = cellW * 0.7;
      const wh = cellH * 0.7;

      const lit = Math.random() > 0.3;
      if (lit) {
        const warm = Math.random() > 0.4;
        ctx.fillStyle = warm
          ? `rgba(255,220,150,${0.5 + Math.random() * 0.4})`
          : `rgba(180,210,255,${0.3 + Math.random() * 0.3})`;
      } else {
        ctx.fillStyle = 'rgba(30,30,50,0.5)';
      }
      ctx.fillRect(wx, wy, ww, wh);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(wx, wy, ww, wh);
    }
  }
  return new THREE.CanvasTexture(canvas);
}

// ─── Building creation ──────────────────────────────────────
function createBuilding(x, z, w, d, h, color) {
  const group = new THREE.Group();

  const bodyGeo = new THREE.BoxGeometry(w, h, d);
  const texture = createWindowTexture(color);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(Math.max(1, Math.floor(w)), Math.max(1, Math.floor(h / 2)));
  const bodyMat = new THREE.MeshStandardMaterial({
    map: texture, roughness: 0.6, metalness: 0.05,
    color: 0xffffff
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Roof
  const roofH = 0.15 + h * 0.05;
  const roofGeo = new THREE.BoxGeometry(w + 0.15, roofH, d + 0.15);
  const roofColors = [0x5a4a3a, 0x4a3a2a, 0x6b5b4b, 0x3d3025, 0x8b7355];
  const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];
  const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5, metalness: 0.1 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = h + roofH / 2;
  roof.castShadow = true;
  group.add(roof);

  // Antenna for ~30% of tall buildings
  if (h > 3.5 && Math.random() < 0.3) {
    const antGeo = new THREE.CylinderGeometry(0.06, 0.06, h * 0.18, 6);
    const antMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3, metalness: 0.8 });
    const ant = new THREE.Mesh(antGeo, antMat);
    ant.position.y = h + roofH + h * 0.09;
    ant.castShadow = true;
    group.add(ant);
    const lightGeo = new THREE.SphereGeometry(0.1, 4, 4);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
    const light = new THREE.Mesh(lightGeo, lightMat);
    light.position.y = h + roofH + h * 0.18 + 0.1;
    group.add(light);
  }

  group.position.set(x, 0, z);
  cityGroup.add(group);
  return { group, x, z, w, d, h, alive: true };
}

// ─── Tree ───────────────────────────────────────────────────
function createTree(x, z) {
  const group = new THREE.Group();
  const trunkH = 0.7 + Math.random() * 1.0;
  const trunkR = 0.08 + Math.random() * 0.12;
  const trunkGeo = new THREE.CylinderGeometry(trunkR * 0.6, trunkR, trunkH, 5);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b6914, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  group.add(trunk);
  const colors = [0x3d7a28, 0x4a8a30, 0x357020, 0x4d9038];
  for (let i = 0; i < 3; i++) {
    const r = 0.35 + Math.random() * 0.5;
    const fh = 0.5 + Math.random() * 0.7;
    const c = colors[Math.floor(Math.random() * colors.length)];
    const fGeo = new THREE.ConeGeometry(r, fh, 6);
    const fMat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
    const f = new THREE.Mesh(fGeo, fMat);
    f.position.y = trunkH + i * fh * 0.45;
    f.castShadow = true; f.receiveShadow = true;
    group.add(f);
  }
  group.position.set(x, 0, z);
  group.scale.setScalar(0.35 + Math.random() * 0.45); // 6-12m street trees at 6.4m/unit → 0.9-1.9u
  cityGroup.add(group);
  return group;
}

// ─── Road ────────────────────────────────────────────────────
function createRoad(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.sqrt(dx * dx + dz * dz);
  const angle = Math.atan2(dx, dz);
  const width = 0.7 + Math.random() * 0.4;
  const geo = new THREE.PlaneGeometry(width, len);
  const mat = new THREE.MeshStandardMaterial({ color: 0x3d3d45, roughness: 0.95 });
  const road = new THREE.Mesh(geo, mat);
  road.rotation.x = -Math.PI / 2; road.rotation.z = angle;
  road.position.set((x1 + x2) / 2, 0.01, (z1 + z2) / 2);
  road.receiveShadow = true;
  cityGroup.add(road);
  roadPaths.push({ x1, z1, x2, z2, width });
}

// ─── Car ─────────────────────────────────────────────────────
function createCar(roadIdx) {
  const road = roadPaths[roadIdx];
  const group = new THREE.Group();

  const bodyGeo = new THREE.BoxGeometry(0.35, 0.22, 0.7);
  const colors = [0xe83333, 0x2266cc, 0xf5a623, 0x33aa55, 0xdddddd, 0x111133, 0xff8800, 0x8833cc];
  const carColor = colors[Math.floor(Math.random() * colors.length)];
  const bodyMat = new THREE.MeshStandardMaterial({ color: carColor, roughness: 0.3, metalness: 0.5 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.22;
  body.castShadow = true;
  group.add(body);

  const cabinGeo = new THREE.BoxGeometry(0.3, 0.18, 0.35);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0x88bbdd, roughness: 0.2, metalness: 0.3, transparent: true, opacity: 0.7 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 0.38, -0.05);
  cabin.castShadow = true;
  group.add(cabin);

  const wheelGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.06, 6);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
  const positions = [[-0.2, 0.08, 0.22], [0.2, 0.08, 0.22], [-0.2, 0.08, -0.22], [0.2, 0.08, -0.22]];
  positions.forEach(([wx, wy, wz]) => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(wx, wy, wz);
    wheel.castShadow = true;
    group.add(wheel);
  });

  const t0 = Math.random();
  const x = road.x1 + (road.x2 - road.x1) * t0;
  const z = road.z1 + (road.z2 - road.z1) * t0;
  const angle = Math.atan2(road.x2 - road.x1, road.z2 - road.z1);
  group.position.set(x, 0.06, z);
  group.rotation.y = angle;

  cityGroup.add(group);

  cars.push({
    group, roadIdx, t: t0,
    speed: 1.5 + Math.random() * 2.5,
    direction: Math.random() > 0.5 ? 1 : -1,
  });
}

// ─── Sidewalks ───────────────────────────────────────────────
function createSidewalks(road) {
  const dx = road.x2 - road.x1, dz = road.z2 - road.z1;
  const len = Math.sqrt(dx * dx + dz * dz);
  const angle = Math.atan2(dx, dz);
  const offsetX = Math.cos(angle) * 1.1;
  const offsetZ = -Math.sin(angle) * 1.1;
  const mat = new THREE.MeshStandardMaterial({ color: 0xb0b0b8, roughness: 0.9 });
  [-1, 1].forEach(side => {
    const geo = new THREE.PlaneGeometry(0.55, len);
    const sw = new THREE.Mesh(geo, mat);
    sw.rotation.x = -Math.PI / 2;
    sw.rotation.z = angle;
    sw.position.set(
      (road.x1 + road.x2) / 2 + offsetX * side,
      0.025,
      (road.z1 + road.z2) / 2 + offsetZ * side
    );
    sw.receiveShadow = true;
    cityGroup.add(sw);
  });
}

// ─── Crosswalk ───────────────────────────────────────────────
function createCrosswalk(x, z, angle, roadWidth) {
  const count = 5;
  const stripeW = 0.18, stripeL = roadWidth;
  const spacing = stripeW * 2.0; // band = gap for readable alternation
  const mat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.6 });
  for (let i = 0; i < count; i++) {
    const geo = new THREE.PlaneGeometry(stripeW, stripeL);
    const stripe = new THREE.Mesh(geo, mat);
    stripe.rotation.x = -Math.PI / 2;
    stripe.rotation.z = angle;
    stripe.position.set(
      x + (i - (count - 1) / 2) * spacing * Math.cos(angle),
      0.028,
      z - (i - (count - 1) / 2) * spacing * Math.sin(angle)
    );
    stripe.receiveShadow = true;
    cityGroup.add(stripe);
  }
}

// ─── Traffic light ───────────────────────────────────────────
function createTrafficLight(x, z) {
  const group = new THREE.Group();
  // Total height ~1.15 units (~1.6× car length, down from 3.7×)
  const poleGeo = new THREE.CylinderGeometry(0.04, 0.05, 0.9, 6);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.4, metalness: 0.6 });
  const pole = new THREE.Mesh(poleGeo, poleMat);
  pole.position.y = 0.45;
  pole.castShadow = true;
  group.add(pole);
  const boxGeo = new THREE.BoxGeometry(0.12, 0.25, 0.12);
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 });
  const box = new THREE.Mesh(boxGeo, boxMat);
  box.position.y = 1.025;
  group.add(box);
  const colors = [0xff2222, 0xffaa00, 0x22cc22];
  colors.forEach((c, i) => {
    const geo = new THREE.SphereGeometry(0.035, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: c });
    const light = new THREE.Mesh(geo, mat);
    light.position.y = 1.025 + (1 - i) * 0.08;
    light.position.z = 0.07;
    group.add(light);
  });
  group.position.set(x, 0, z);
  group.scale.setScalar(0.43); // 3.2m traffic light at 6.4m/unit → ~0.50u
  cityGroup.add(group);
}

// ─── Pedestrian ──────────────────────────────────────────────
function createPedestrian(roadIdx, side) {
  const road = roadPaths[roadIdx];
  const group = new THREE.Group();
  const bodyGeo = new THREE.CapsuleGeometry(0.09, 0.35, 4, 6);
  const clothes = [0x3344aa, 0xcc3333, 0x33aa44, 0xdd8800, 0x7733aa, 0x555555, 0xee6699];
  const bodyMat = new THREE.MeshStandardMaterial({ color: clothes[Math.floor(Math.random() * clothes.length)], roughness: 0.7 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.4;
  body.castShadow = true;
  group.add(body);
  const headGeo = new THREE.SphereGeometry(0.1, 6, 6);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffd9b3, roughness: 0.6 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 0.78;
  head.castShadow = true;
  group.add(head);

  const t0 = Math.random();
  const dx = road.x2 - road.x1, dz = road.z2 - road.z1;
  const angle = Math.atan2(dx, dz);
  const offX = Math.cos(angle) * 1.1 * side;
  const offZ = -Math.sin(angle) * 1.1 * side;
  const x = road.x1 + dx * t0 + offX;
  const z = road.z1 + dz * t0 + offZ;
  group.position.set(x, 0.03, z);
  group.rotation.y = angle;
  group.scale.setScalar(0.3); // 1.75m pedestrian at 6.4m/unit → ~0.27u
  cityGroup.add(group);
  return { group, roadIdx, side, t: t0, speed: 0.3 + Math.random() * 0.5, direction: Math.random() > 0.5 ? 1 : -1 };
}

// ─── Beach items (littoral only) ────────────────────────────
// All sizes at 6.4 m/unit scale:
//   Parasol: diam 2.5m → 0.39u, h 2.2m → 0.34u
//   Transat: 1.8m → 0.28u, Bather: 1.75m → 0.27u, Ball: 0.4m diam → 0.06u
function createBeachItems(map) {
  const beachZ = map.beachZ;
  if (beachZ === undefined) return; // island uses ring beach

  // Safety margin from beach edges (both sides)
  const margin = 0.5;
  const spreadZ = map.beachDepth - 2 * margin;

  const canopyColors = [0xff5533, 0xffaa00, 0x33aaff, 0xff3366, 0x33cc88, 0xffdd00];
  const transatStripeColors = [0x2255cc, 0xcc2222, 0x22aa44];
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.5 });

  for (let i = 0; i < 20; i++) {
    const bx = -14 + Math.random() * 28;
    const bz = beachZ + (Math.random() - 0.5) * spreadZ;

    // ── Parasol: total height ~0.34, canopy diameter ~0.40 ──
    const paraGroup = new THREE.Group();
    const poleGeo = new THREE.CylinderGeometry(0.008, 0.01, 0.20, 6);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0xddccaa, roughness: 0.6 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = 0.10;
    pole.castShadow = true;
    paraGroup.add(pole);
    const canopyGeo = new THREE.ConeGeometry(0.20, 0.14, 8);
    const canopyMat = new THREE.MeshStandardMaterial({
      color: canopyColors[Math.floor(Math.random() * canopyColors.length)], roughness: 0.5
    });
    const canopy = new THREE.Mesh(canopyGeo, canopyMat);
    canopy.position.y = 0.27; // pole top (0.20) + half cone (0.07)
    canopy.castShadow = true;
    paraGroup.add(canopy);
    paraGroup.position.set(bx, 0.04, bz);
    cityGroup.add(paraGroup);

    // ── Transat: 0.28 long × 0.13 wide ──
    const chairGroup = new THREE.Group();
    const seatGeo = new THREE.BoxGeometry(0.13, 0.025, 0.28);
    const seatMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const seat = new THREE.Mesh(seatGeo, seatMat);
    seat.position.y = 0.03;
    seat.receiveShadow = true;
    chairGroup.add(seat);
    for (let s = 0; s < 5; s++) {
      const stripeGeo = new THREE.BoxGeometry(0.13, 0.003, 0.04);
      const stripeMat = new THREE.MeshStandardMaterial({ color: transatStripeColors[s % 3] });
      const stripe = new THREE.Mesh(stripeGeo, stripeMat);
      stripe.position.y = 0.045;
      stripe.position.z = -0.10 + s * 0.05;
      chairGroup.add(stripe);
    }
    // Offset from parasol centre, within canopy radius
    chairGroup.position.set(bx + 0.12, 0.04, bz + 0.10);
    chairGroup.rotation.y = Math.random() * Math.PI;
    cityGroup.add(chairGroup);

    // ── Bather lying on transat: total body length ~0.27 ──
    const personGroup = new THREE.Group();
    const batherBodyGeo = new THREE.CapsuleGeometry(0.025, 0.22, 4, 6);
    const batherBody = new THREE.Mesh(batherBodyGeo, skinMat);
    batherBody.position.y = 0.06;
    batherBody.rotation.z = Math.PI / 2; // lay flat
    batherBody.castShadow = true;
    personGroup.add(batherBody);
    const batherHeadGeo = new THREE.SphereGeometry(0.035, 6, 6);
    const batherHead = new THREE.Mesh(batherHeadGeo, skinMat);
    batherHead.position.set(0, 0.06, -0.13); // head at one end of body
    batherHead.castShadow = true;
    personGroup.add(batherHead);
    // Position on/near transat
    personGroup.position.set(bx + 0.14 + (Math.random() - 0.5) * 0.08, 0.06, bz + 0.12);
    personGroup.rotation.y = Math.random() * Math.PI;
    cityGroup.add(personGroup);
  }

  // Beach ball
  const ballGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xff6644, roughness: 0.3 });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(3, 0.06, beachZ + 1.0);
  ball.castShadow = true;
  cityGroup.add(ball);

  // Extra scattered balls
  for (let i = 0; i < 4; i++) {
    const extraBall = new THREE.Mesh(ballGeo, ballMat.clone());
    extraBall.material.color.setHSL(Math.random() * 0.1 + 0.05, 0.8, 0.5 + Math.random() * 0.3);
    const ebx = -12 + Math.random() * 24;
    const ebz = beachZ + (Math.random() - 0.5) * spreadZ;
    extraBall.position.set(ebx, 0.04, ebz);
    extraBall.castShadow = true;
    cityGroup.add(extraBall);
  }
}

// ─── Find road intersections ─────────────────────────────────
function findIntersections() {
  const points = [];
  for (let i = 0; i < roadPaths.length; i++) {
    for (let j = i + 1; j < roadPaths.length; j++) {
      const a = roadPaths[i], b = roadPaths[j];
      // Check if one is roughly vertical and the other horizontal
      const aVert = Math.abs(a.x2 - a.x1) < Math.abs(a.z2 - a.z1);
      const bVert = Math.abs(b.x2 - b.x1) < Math.abs(b.z2 - b.z1);
      if (aVert === bVert) continue;
      // Find intersection of line segments
      const vert = aVert ? a : b;
      const horz = aVert ? b : a;
      const vertIdx = aVert ? i : j;
      const horzIdx = aVert ? j : i;
      const vx = (vert.x1 + vert.x2) / 2;
      const hz = (horz.z1 + horz.z2) / 2;
      // Check if intersection lies within both segments
      const vzMin = Math.min(vert.z1, vert.z2), vzMax = Math.max(vert.z1, vert.z2);
      const hxMin = Math.min(horz.x1, horz.x2), hxMax = Math.max(horz.x1, horz.x2);
      if (vx >= hxMin - 0.5 && vx <= hxMax + 0.5 && hz >= vzMin - 0.5 && hz <= vzMax + 0.5) {
        points.push({ x: vx, z: hz, vertIdx, horzIdx });
      }
    }
  }
  return points;
}

// ─── Map generation (fully parameterized) ───────────────────
function generateMap(map) {
  currentMap = map;

  // ── Purge entire map group ──────────────────────────────
  disposeGroup(mapGroup);
  scene.remove(mapGroup);

  mapGroup = new THREE.Group();
  scene.add(mapGroup);

  cityGroup = new THREE.Group();
  mapGroup.add(cityGroup);

  oceanGroup = new THREE.Group();
  mapGroup.add(oceanGroup);

  oceanPlanes = [];
  cars = [];
  roadPaths = [];
  pedestrians = [];
  buildings = [];
  walls = [];
  trenches = [];
  waves = [];
  particlePool.forEach(p => { scene.remove(p.mesh); p.mesh.geometry?.dispose(); p.mesh.material?.dispose(); });
  particlePool = [];
  ghostGroup.visible = false;

  // ── Ground ──────────────────────────────────────────────
  if (map.islandRadius) {
    // Circular island ground
    const groundGeo = new THREE.CircleGeometry(map.islandRadius, 48);
    const groundMat = new THREE.MeshStandardMaterial({ color: map.groundColor, roughness: 0.85 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    mapGroup.add(ground);

    // Ring beach
    const beachGeo = new THREE.RingGeometry(map.beachInnerR, map.beachOuterR, 64);
    const beachMat = new THREE.MeshStandardMaterial({ color: 0xe8d5a8, roughness: 0.9 });
    const beach = new THREE.Mesh(beachGeo, beachMat);
    beach.rotation.x = -Math.PI / 2;
    beach.position.y = 0.02;
    beach.receiveShadow = true;
    mapGroup.add(beach);

    // Foam ring
    const foamGeo = new THREE.RingGeometry(map.beachOuterR - 0.3, map.beachOuterR + 0.2, 64);
    const foamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
    const foamRing = new THREE.Mesh(foamGeo, foamMat);
    foamRing.rotation.x = -Math.PI / 2;
    foamRing.position.y = 0.05;
    foamRing.name = 'foamRing';
    mapGroup.add(foamRing);

    // Ocean planes around the island (north, south, east, west)
    const oceanMat = new THREE.MeshStandardMaterial({
      color: 0x1565a8, roughness: 0.2, metalness: 0.7,
      transparent: true, opacity: 0.88
    });
    const oceanSides = [
      { x: 0, z: -(map.beachOuterR + 7), w: 36, d: 14, name: 'south' },
      { x: 0, z: (map.beachOuterR + 7), w: 36, d: 14, name: 'north' },
      { x: -(map.beachOuterR + 7), z: 0, w: 14, d: 36, name: 'west' },
      { x: (map.beachOuterR + 7), z: 0, w: 14, d: 36, name: 'east' },
    ];
    oceanSides.forEach(side => {
      const segW = side.name === 'north' || side.name === 'south' ? side.w : side.d;
      const segH = side.name === 'north' || side.name === 'south' ? side.d : side.w;
      const geo = new THREE.PlaneGeometry(segW, segH, Math.max(8, Math.floor(segW / 2)), Math.max(4, Math.floor(segH / 2)));
      const mesh = new THREE.Mesh(geo, oceanMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(side.x, 0.06, side.z);
      mesh.receiveShadow = true;
      mesh.userData = { oceanSide: side.name };
      oceanGroup.add(mesh);
      oceanPlanes.push(mesh);
    });

    // Far ocean (under everything — matches near ocean material for seamless blend)
    const farOceanGeo = new THREE.PlaneGeometry(400, 200);
    const farOceanMat = new THREE.MeshStandardMaterial({
      color: 0x1565a8, roughness: 0.2, metalness: 0.7,
      transparent: true, opacity: 0.88
    });
    const farOcean = new THREE.Mesh(farOceanGeo, farOceanMat);
    farOcean.rotation.x = -Math.PI / 2;
    farOcean.position.set(0, 0.01, 0);
    mapGroup.add(farOcean);

  } else {
    // ── Littoral (rectangular terrain) ────────────────────
    const groundGeo = new THREE.PlaneGeometry(map.terrainHalf * 2 + 6, map.terrainHalf * 2 + 6);
    const groundMat = new THREE.MeshStandardMaterial({ color: map.groundColor, roughness: 0.85 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    mapGroup.add(ground);

    // Animated near ocean (position derived from beach params)
    const beachSouthEdge = map.beachZ - map.beachDepth / 2;
    const nearOceanZ = beachSouthEdge - map.oceanDepth / 2;
    const oceanGeo = new THREE.PlaneGeometry(map.oceanWidth, map.oceanDepth, Math.floor(map.oceanWidth), Math.floor(map.oceanDepth));
    const oceanMat = new THREE.MeshStandardMaterial({
      color: 0x1565a8, roughness: 0.2, metalness: 0.7,
      transparent: true, opacity: 0.88
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.set(0, 0.08, nearOceanZ);
    ocean.receiveShadow = true;
    ocean.name = 'nearOcean';
    oceanGroup.add(ocean);
    oceanPlanes.push(ocean);

    // Beach
    const beachGeo = new THREE.PlaneGeometry(map.beachWidth, map.beachDepth);
    const beachMat = new THREE.MeshStandardMaterial({ color: 0xe8d5a8, roughness: 0.9 });
    const beach = new THREE.Mesh(beachGeo, beachMat);
    beach.rotation.x = -Math.PI / 2;
    beach.position.set(0, 0.02, map.beachZ);
    beach.receiveShadow = true;
    mapGroup.add(beach);

    // Foam line (at the beach/ocean boundary)
    const foamGeo = new THREE.PlaneGeometry(map.beachWidth, 0.5);
    const foamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
    const foamLine = new THREE.Mesh(foamGeo, foamMat);
    foamLine.rotation.x = -Math.PI / 2;
    foamLine.position.set(0, 0.05, beachSouthEdge);
    foamLine.name = 'foamLine';
    mapGroup.add(foamLine);

    // Far ocean (seamless horizon — matches near ocean material, extends far south)
    const farOceanGeo2 = new THREE.PlaneGeometry(400, 200);
    const farOceanMat2 = new THREE.MeshStandardMaterial({
      color: 0x1565a8, roughness: 0.2, metalness: 0.7,
      transparent: true, opacity: 0.88
    });
    const farOcean2 = new THREE.Mesh(farOceanGeo2, farOceanMat2);
    farOcean2.rotation.x = -Math.PI / 2;
    farOcean2.position.set(0, 0.03, beachSouthEdge - 100);
    mapGroup.add(farOcean2);
  }

  // ── Grid helper ─────────────────────────────────────────
  const grid = new THREE.GridHelper(map.terrainHalf * 2, map.terrainHalf, 0x3d6b2e, 0x4a7a35);
  grid.position.y = 0.01;
  mapGroup.add(grid);

  // ── Roads ───────────────────────────────────────────────
  for (const r of (map.roads || [])) {
    createRoad(r.x1, r.z1, r.x2, r.z2);
  }

  // ── Buildings along roads ──────────────────────────────
  const placed = [];

  function distToRoad(px, pz) {
    let minDist = Infinity;
    for (const r of roadPaths) {
      const dx = r.x2 - r.x1, dz = r.z2 - r.z1;
      const lenSq = dx * dx + dz * dz;
      if (lenSq < 0.01) continue;
      let t = ((px - r.x1) * dx + (pz - r.z1) * dz) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const cx = r.x1 + t * dx, cz = r.z1 + t * dz;
      minDist = Math.min(minDist, Math.hypot(px - cx, pz - cz));
    }
    return minDist;
  }

  function tooClose(px, pz, margin = 3) {
    return placed.some(p => Math.hypot(p.x - px, p.z - pz) < margin);
  }

  function inBuildZone(px, pz) {
    if (px < map.buildXMin || px > map.buildXMax) return false;
    if (pz < map.buildZMin || pz > map.buildZMax) return false;
    if (!isOnIsland(px, pz, map)) return false;
    return true;
  }

  for (const road of roadPaths) {
    const dx = road.x2 - road.x1, dz = road.z2 - road.z1;
    const len = Math.sqrt(dx * dx + dz * dz);
    const angle = Math.atan2(dx, dz);
    const nx = Math.cos(angle);
    const nz = -Math.sin(angle);
    const setback = 2.6 + Math.random() * 1.0;

    for (const side of [-1, 1]) {
      const spacing = 3.5 + Math.random() * 2;
      const count = Math.floor(len / spacing);
      for (let i = 0; i < count; i++) {
        const t = (i + 0.5) / count;
        const bx = road.x1 + dx * t + nx * setback * side;
        const bz = road.z1 + dz * t + nz * setback * side;

        if (Math.abs(bx) > map.terrainHalf - 0.5 || Math.abs(bz) > map.terrainHalf - 0.5) continue;
        if (!inBuildZone(bx, bz)) continue;
        if (tooClose(bx, bz, 2.5)) continue;

        const w = 0.8 + Math.random() * 1.2;
        const d = 0.8 + Math.random() * 1.2;
        const h = 1.5 + Math.random() * 4.5;
        const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
        const building = createBuilding(bx, bz, w, d, h, color);
        buildings.push(building);
        placed.push({ x: bx, z: bz });
      }
    }
  }

  // Fill gaps with scattered buildings
  for (let i = 0; i < 10; i++) {
    let attempts = 0, x, z;
    do {
      x = (Math.random() - 0.5) * (map.terrainHalf * 2 - 4);
      z = (Math.random() - 0.5) * (map.terrainHalf * 2 - 6) + 1;
      attempts++;
    } while (attempts < 60 && (
      tooClose(x, z, 3) ||
      distToRoad(x, z) < 1.5 ||
      distToRoad(x, z) > 8 ||
      !inBuildZone(x, z)
    ));
    if (attempts >= 60) continue;
    const w = 0.8 + Math.random() * 1.2;
    const d = 0.8 + Math.random() * 1.2;
    const h = 1.5 + Math.random() * 4.5;
    const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
    const building = createBuilding(x, z, w, d, h, color);
    buildings.push(building);
    placed.push({ x, z });
  }

  // Downtown cluster for littoral
  if (!map.islandRadius) {
    for (let i = 0; i < 6; i++) {
      let x, z, attempts = 0;
      do {
        x = -6 + i * 2.5 + (Math.random() - 0.5) * 0.5;
        z = -2 + Math.random() * 4;
        attempts++;
      } while (attempts < 30 && (distToRoad(x, z) < 2.0 || tooClose(x, z, 3)));
      const w = 1.4 + Math.random() * 0.8;
      const d = 1.4 + Math.random() * 0.8;
      const h = 5 + Math.random() * 7;
      const color = new THREE.Color().setHSL(0.58 + Math.random() * 0.08, 0.4 + Math.random() * 0.3, 0.35 + Math.random() * 0.25).getHex();
      const building = createBuilding(x, z, w, d, h, color);
      buildings.push(building);
    }
  }

  // Trees near buildings
  for (const b of buildings) {
    for (let t = 0; t < 2 + Math.floor(Math.random() * 3); t++) {
      const tx = b.x + (Math.random() - 0.5) * (b.w + 4);
      const tz = b.z + (Math.random() - 0.5) * (b.d + 4);
      if (!tooClose(tx, tz, 1.8) && distToRoad(tx, tz) > 1.8 && inBuildZone(tx, tz)) {
        createTree(tx, tz);
        placed.push({ x: tx, z: tz });
      }
    }
  }

  // Beach items (only for maps with a beach zone)
  createBeachItems(map);

  // Cars
  for (let ri = 0; ri < roadPaths.length; ri++) {
    const count = 1 + Math.floor(Math.random() * 2);
    for (let ci = 0; ci < count; ci++) createCar(ri);
  }

  // Sidewalks, crosswalks, traffic lights
  roadPaths.forEach(r => createSidewalks(r));
  const intersections = findIntersections();
  intersections.forEach(({ x, z, vertIdx, horzIdx }) => {
    const vertRoad = roadPaths[vertIdx]; // N-S road
    const horzRoad = roadPaths[horzIdx]; // E-W road
    const offset = 0.6; // places crosswalk on the road, past the intersection
    // Crosswalk crossing E-W road (angle=0 → stripes run N-S)
    createCrosswalk(x + offset, z, 0, horzRoad.width);
    // Crosswalk crossing N-S road (angle=PI/2 → stripes run E-W)
    createCrosswalk(x, z + offset, Math.PI / 2, vertRoad.width);
    createTrafficLight(x + 1.4, z - 1.4);
  });

  // Pedestrians
  pedestrians = [];
  for (let ri = 0; ri < roadPaths.length; ri++) {
    for (let s = 0; s < 2; s++) {
      const count = 1 + Math.floor(Math.random() * 3);
      for (let pi = 0; pi < count; pi++) {
        pedestrians.push(createPedestrian(ri, s === 0 ? -1 : 1));
      }
    }
  }

  // ── Reset game state ────────────────────────────────────
  resources = 150;
  score = 0;
  gameOver = false;
  waveCountdown = 20;
  waveNumber = 0;
  currentTier = 1;
  trenchMode = false;
  alertTriggered = false;
  nextWaveDir = map.waveDirections[0];

  updateHUD();
}

// ─── Wall placement ─────────────────────────────────────────
function placeWall(worldPos) {
  if (gameOver || !currentMap) return false;
  const tier = WALL_TIERS[currentTier];
  if (resources < tier.cost) {
    flashMessage(`Pas assez de ressources (${tier.cost}☼ pour ${tier.name}) !`);
    return false;
  }
  if (Math.abs(worldPos.x) > currentMap.terrainHalf || Math.abs(worldPos.z) > currentMap.terrainHalf) return false;
  if (!isInBuildZoneForPlacement(worldPos.x, worldPos.z)) return false;

  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: tier.color, roughness: 0.8, metalness: 0.05 });

  const geo = new THREE.BoxGeometry(1.1, tier.geoH, 0.45);
  const bag = new THREE.Mesh(geo, mat);
  bag.position.y = tier.geoH / 2;
  bag.castShadow = true; bag.receiveShadow = true;
  group.add(bag);

  const topGeo = new THREE.BoxGeometry(1.0, tier.geoH * 0.7, 0.4);
  const topBag = new THREE.Mesh(topGeo, mat.clone());
  topBag.position.y = tier.geoH + tier.geoH * 0.35;
  topBag.castShadow = true;
  group.add(topBag);

  group.position.set(worldPos.x, 0, worldPos.z);
  scene.add(group);

  walls.push({ group, x: worldPos.x, z: worldPos.z, hp: tier.hp, maxHp: tier.hp, tier: currentTier });
  resources -= tier.cost;
  updateHUD();
  return true;
}

// ─── Trench placement ───────────────────────────────────────
function placeTrench(worldPos) {
  if (gameOver || !currentMap) return false;
  if (resources < TRENCH_COST) { flashMessage('Pas assez de ressources !'); return false; }
  if (Math.abs(worldPos.x) > currentMap.terrainHalf || Math.abs(worldPos.z) > currentMap.terrainHalf) return false;
  if (!isInBuildZoneForPlacement(worldPos.x, worldPos.z)) return false;

  const geo = new THREE.BoxGeometry(1.0, 0.15, 0.9);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 1.0, metalness: 0 });
  const trenchMesh = new THREE.Mesh(geo, mat);
  trenchMesh.position.set(worldPos.x, -0.06, worldPos.z);
  trenchMesh.receiveShadow = true;
  scene.add(trenchMesh);

  trenches.push({ mesh: trenchMesh, x: worldPos.x, z: worldPos.z, hp: TRENCH_HP, maxHp: TRENCH_HP });
  resources -= TRENCH_COST;
  updateHUD();
  return true;
}

// ─── Placement zone check ───────────────────────────────────
function isInBuildZoneForPlacement(px, pz) {
  if (!currentMap) return false;
  if (currentMap.islandRadius) {
    return (px * px + pz * pz) <= currentMap.islandRadius * currentMap.islandRadius;
  }
  // For littoral: check build zone + don't place on beach
  if (pz < currentMap.buildZMin) return false;
  return true;
}

// ─── Wave system ────────────────────────────────────────────
function spawnWave() {
  if (gameOver || !currentMap) return;

  waveNumber++;
  const map = currentMap;
  const dir = nextWaveDir; // 'north' or 'south'
  const dirSign = dir === 'north' ? -1 : 1;

  const difficulty = Math.min(waveNumber / 5, 1);
  const waveWidth = 6 + Math.random() * (8 + difficulty * 18);
  const waveH = 1.5 + difficulty * 5;
  const speed = 3 + difficulty * 4;
  const maxOffset = Math.max(0, map.terrainHalf - waveWidth / 2);
  const waveX = (Math.random() * 2 - 1) * maxOffset;

  const SEG_W = 1.0;
  const n = Math.max(1, Math.ceil(waveWidth / SEG_W));
  const segHp = (80 + difficulty * 200) / n;
  const segments = [];
  const segMeshes = [];

  const spawnZ = map.waveSpawnZ[dir];

  for (let i = 0; i < n; i++) {
    const sx = waveX - waveWidth / 2 + (i + 0.5) * (waveWidth / n);
    segments.push({ x: sx, hp: segHp, maxHp: segHp, alive: true });
    const segGeo = new THREE.BoxGeometry(waveWidth / n, waveH, 2.2);
    const segMat = new THREE.MeshStandardMaterial({
      color: 0x3377bb, roughness: 0.2, metalness: 0.4,
      transparent: true, opacity: 0.7
    });
    const segMesh = new THREE.Mesh(segGeo, segMat);
    segMesh.position.set(sx, waveH / 2, spawnZ);
    segMesh.castShadow = true;
    segMesh.receiveShadow = true;
    scene.add(segMesh);
    segMeshes.push(segMesh);
  }

  waves.push({
    segments, segMeshes,
    speed, z: spawnZ, x: waveX,
    width: waveWidth, height: waveH,
    destroyedBuildings: 0,
    dirSign, dir,
  });

  const dirLabel = dir === 'north' ? 'NORD' : 'SUD';
  const offsetLabel = waveX < -5 ? "à l'ouest" : waveX > 5 ? "à l'est" : "au centre";
  flashMessage(`🌊 Vague #${waveNumber} — front ${dirLabel} (${offsetLabel}) !`, 1800);
}

// ─── Particle pool ──────────────────────────────────────────
const sprayGeo = new THREE.SphereGeometry(0.08, 3, 3);
const sprayMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, depthWrite: false });
const debrisGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
const debrisMat = new THREE.MeshStandardMaterial({ color: 0x998877, roughness: 0.8, depthWrite: false });
let particlePool = [];

function spawnParticle(x, y, z, vx, vy, vz, life, type) {
  let p = particlePool.find(p => p.life <= 0);
  if (!p) {
    const geo = type === 'spray' ? sprayGeo : debrisGeo;
    const mat = type === 'spray' ? sprayMat.clone() : debrisMat.clone();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    scene.add(mesh);
    p = { mesh, vx: 0, vy: 0, vz: 0, life: 0, maxLife: 1, type };
    particlePool.push(p);
  }
  if (p.type !== type) {
    p.mesh.geometry = type === 'spray' ? sprayGeo : debrisGeo;
    p.mesh.material = type === 'spray' ? sprayMat.clone() : debrisMat.clone();
    p.type = type;
  }
  p.mesh.position.set(x, y, z);
  p.mesh.visible = true;
  p.mesh.scale.setScalar(1);
  if (p.mesh.material.opacity !== undefined) p.mesh.material.opacity = 0.7;
  p.vx = vx; p.vy = vy; p.vz = vz;
  p.life = life; p.maxLife = life;
}

function spawnSpray(x, y, z) {
  for (let i = 0; i < 3; i++) {
    spawnParticle(x, y, z,
      (Math.random() - 0.5) * 1.5, 0.5 + Math.random() * 3, (Math.random() - 0.5) * 1,
      0.5 + Math.random() * 0.5, 'spray');
  }
}

function spawnDestroyParticles(x, y, z) {
  for (let i = 0; i < 12; i++) {
    spawnParticle(
      x + (Math.random() - 0.5) * 2, y + Math.random() * 2, z + (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 3, 3 + Math.random() * 5, (Math.random() - 0.5) * 3,
      1.0 + Math.random() * 0.8, 'debris');
  }
}

function updateWaves(dt) {
  if (!currentMap) return;
  const map = currentMap;

  for (let wi = waves.length - 1; wi >= 0; wi--) {
    const wave = waves[wi];

    // T5: sub-step anti-tunneling
    const maxStep = 0.4 / wave.speed;
    const steps = Math.max(1, Math.ceil(dt / maxStep));
    const subDt = dt / steps;

    for (let step = 0; step < steps; step++) {
      wave.z += wave.speed * wave.dirSign * subDt;

      // Update segment meshes
      for (let si = 0; si < wave.segments.length; si++) {
        const seg = wave.segments[si];
        const sm = wave.segMeshes[si];
        sm.position.z = wave.z;
        if (!seg.alive) { sm.visible = false; continue; }
        sm.visible = true;
        sm.position.y = wave.height / 2;
        const segHp = seg.hp / seg.maxHp;
        sm.material.opacity = 0.2 + segHp * 0.55;
        sm.scale.y = 0.3 + segHp * 0.7;
      }

      // Trench vs segments
      for (let ti = trenches.length - 1; ti >= 0; ti--) {
        const trench = trenches[ti];
        if (Math.abs(trench.z - wave.z) > 1.2) continue;
        for (const seg of wave.segments) {
          if (!seg.alive) continue;
          if (Math.abs(trench.x - seg.x) < 0.8) {
            const dmg = TRENCH_DAMAGE * subDt;
            seg.hp -= dmg; trench.hp -= dmg;
            if (seg.hp <= 0) seg.alive = false;
          }
        }
        const ratio = Math.max(0, trench.hp / trench.maxHp);
        trench.mesh.material.opacity = 0.7 + ratio * 0.3;
        trench.mesh.scale.y = Math.max(0.1, ratio);
        if (trench.hp <= 0) {
          scene.remove(trench.mesh); trench.mesh.geometry.dispose(); trench.mesh.material.dispose();
          trenches.splice(ti, 1);
        }
      }

      // Walls vs segments
      for (let i = walls.length - 1; i >= 0; i--) {
        const wall = walls[i];
        if (Math.abs(wall.z - wave.z) > 1.5) continue;
        let hitAny = false;
        for (const seg of wave.segments) {
          if (!seg.alive) continue;
          if (Math.abs(wall.x - seg.x) < 0.7) {
            hitAny = true;
            const dmg = 30 * subDt;
            seg.hp -= dmg; wall.hp -= dmg * 0.5;
            if (seg.hp <= 0) seg.alive = false;
          }
        }
        if (hitAny) {
          const wallHpRatio = Math.max(0, wall.hp / wall.maxHp);
          const base = new THREE.Color(WALL_TIERS[wall.tier]?.color || 0xd4b896);
          const damaged = base.clone().multiplyScalar(0.3 + wallHpRatio * 0.7);
          wall.group.children.forEach(c => {
            if (c.material && c.material.color) c.material.color.copy(damaged);
          });
          wall.group.scale.y = Math.max(0.3, wallHpRatio);
          if (wall.hp <= 0) {
            scene.remove(wall.group);
            wall.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
            walls.splice(i, 1);
          }
        }
      }

      // Buildings vs segments
      for (const building of buildings) {
        if (!building.alive) continue;
        if (Math.abs(building.z - wave.z) > 2) continue;
        for (const seg of wave.segments) {
          if (!seg.alive) continue;
          if (Math.abs(building.x - seg.x) < building.w / 2 + 0.5) {
            seg.hp -= building.h * 8;
            if (seg.hp <= 0) seg.alive = false;
            building.alive = false;
            building.group.removeFromParent();
            building.group.traverse(c => {
              if (c.geometry) c.geometry.dispose();
              if (c.material) { if (c.material.map) c.material.map.dispose(); c.material.dispose(); }
            });
            wave.destroyedBuildings++;
            spawnDestroyParticles(building.x, building.h, building.z);
            break;
          }
        }
      }
    } // end sub-step loop

    // Spray (cosmetic)
    wave.sprayTimer = (wave.sprayTimer || 0) - dt;
    if (wave.sprayTimer <= 0) {
      wave.sprayTimer = 0.06;
      for (let s = 0; s < 4; s++) {
        const sx = wave.x + (Math.random() - 0.5) * wave.width * 0.85;
        const sy = wave.height * 0.6 + Math.random() * wave.height * 0.4;
        const sz = wave.z + wave.dirSign * (1 + Math.random() * 0.4);
        spawnSpray(sx, sy, sz);
      }
    }

    // Wave removal — bidirectional check
    const pastNorth = wave.dirSign === -1 && wave.z < -map.terrainHalf - 5;
    const pastSouth = wave.dirSign === 1 && wave.z > map.terrainHalf + 5;
    const allDead = !wave.segments.some(s => s.alive);

    if (pastNorth || pastSouth || allDead) {
      if (pastNorth || pastSouth) {
        const alive = buildings.filter(b => b.alive).length;
        score += 10 + waveNumber * 2 + alive;
        resources = Math.min(RESOURCE_CAP, resources + 15 + waveNumber * 2);
      } else {
        score += 20 + waveNumber * 3;
        resources = Math.min(RESOURCE_CAP, resources + 25 + waveNumber * 3);
      }
      wave.segMeshes.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
      waves.splice(wi, 1);
    }
  }
}

// ─── Water animation ────────────────────────────────────────
function animateOcean(time) {
  for (const oceanPlane of oceanPlanes) {
    const geo = oceanPlane.geometry;
    if (!geo || !geo.attributes || !geo.attributes.position) continue;
    const positions = geo.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const y = positions.getY(i);
      const z = 0.2 * Math.sin(x * 1.1 + time * 1.6) * Math.cos(y * 1.5 + time * 1.4)
              + 0.12 * Math.sin(x * 2.3 + time * 2.1) * Math.sin(y * 1.9 - time * 1.3)
              + 0.06 * Math.cos(x * 3.7 + time * 2.8) * Math.cos(y * 3.1 - time * 1.9);
      positions.setZ(i, z);
    }
    positions.needsUpdate = true;
  }

  // Foam pulse (littoral foam line or island foam ring)
  const foam = mapGroup.getObjectByName('foamLine') || mapGroup.getObjectByName('foamRing');
  if (foam) {
    foam.material.opacity = 0.35 + Math.sin(time * 2.2) * 0.12;
  }
}

// ─── HUD ────────────────────────────────────────────────────
function updateHUD() {
  if (!currentMap) return;
  const alive = buildings.filter(b => b.alive).length;
  $buildings.textContent = alive;
  if (alive <= 8) $buildings.classList.add('warning');
  else $buildings.classList.remove('warning');
  $resources.textContent = Math.floor(resources);
  $wallsCount.textContent = walls.length;
  $trenchesCount.textContent = trenches.length;
  $score.textContent = score;
  const tier = WALL_TIERS[currentTier];
  $mode.textContent = trenchMode ? '🕳️ Mode tranchée (5☼)' : `🧱 ${tier.name} (${tier.cost}☼)`;
}

function flashMessage(text, duration = 2000) {
  $message.textContent = text;
  $message.classList.add('show');
  clearTimeout($message._timeout);
  $message._timeout = setTimeout(() => $message.classList.remove('show'), duration);
}

// ─── Raycaster & ghost preview ──────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

const ghostMat = new THREE.MeshStandardMaterial({ color: 0x44ff44, roughness: 0.5, transparent: true, opacity: 0.45, depthWrite: false });
const ghostGroup = new THREE.Group();
ghostGroup.visible = false;
scene.add(ghostGroup);

function isValidPlacement(x, z) {
  if (!currentMap) return false;
  const map = currentMap;
  if (Math.abs(x) > map.terrainHalf || Math.abs(z) > map.terrainHalf) return false;
  if (!isInBuildZoneForPlacement(x, z)) return false;
  for (const b of buildings) {
    if (!b.alive) continue;
    if (Math.abs(b.x - x) < b.w / 2 + 0.7 && Math.abs(b.z - z) < b.d / 2 + 0.7) return false;
  }
  for (const w of walls) {
    if (Math.abs(w.x - x) < 0.8 && Math.abs(w.z - z) < 0.8) return false;
  }
  for (const t of trenches) {
    if (Math.abs(t.x - x) < 0.8 && Math.abs(t.z - z) < 0.8) return false;
  }
  const cost = trenchMode ? TRENCH_COST : WALL_TIERS[currentTier].cost;
  return resources >= cost;
}

function updateGhost(snapped) {
  ghostGroup.clear();
  const valid = isValidPlacement(snapped.x, snapped.z);
  ghostMat.color.set(valid ? 0x44ff44 : 0xff4444);
  ghostMat.opacity = valid ? 0.45 : 0.35;

  if (trenchMode) {
    const geo = new THREE.BoxGeometry(1.0, 0.15, 0.9);
    const m = new THREE.Mesh(geo, ghostMat);
    m.position.y = -0.06;
    ghostGroup.add(m);
  } else {
    const tier = WALL_TIERS[currentTier];
    const geo = new THREE.BoxGeometry(1.1, tier.geoH, 0.45);
    const m1 = new THREE.Mesh(geo, ghostMat);
    m1.position.y = tier.geoH / 2;
    ghostGroup.add(m1);
    const topGeo = new THREE.BoxGeometry(1.0, tier.geoH * 0.7, 0.4);
    const m2 = new THREE.Mesh(topGeo, ghostMat);
    m2.position.y = tier.geoH + tier.geoH * 0.35;
    ghostGroup.add(m2);
  }
  ghostGroup.position.set(snapped.x, 0, snapped.z);
  ghostGroup.visible = true;
}

renderer.domElement.addEventListener('mousemove', (e) => {
  if (gameOver || !currentMap) { ghostGroup.visible = false; return; }
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersection = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(groundPlane, intersection)) {
    updateGhost(new THREE.Vector3(
      Math.round(intersection.x * 2) / 2, 0,
      Math.round(intersection.z * 2) / 2
    ));
  } else {
    ghostGroup.visible = false;
  }
});

renderer.domElement.addEventListener('click', (e) => {
  if (gameOver || !currentMap) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersection = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, intersection);
  if (intersection) {
    const snapped = new THREE.Vector3(
      Math.round(intersection.x * 2) / 2, 0,
      Math.round(intersection.z * 2) / 2
    );
    if (trenchMode) placeTrench(snapped); else placeWall(snapped);
    updateGhost(snapped);
  }
});

// ─── Game loop ──────────────────────────────────────────────
let lastFrameTime = performance.now() / 1000;

function gameLoop() {
  requestAnimationFrame(gameLoop);

  const now = performance.now() / 1000;
  let dt = now - lastFrameTime;
  lastFrameTime = now;
  if (dt > 0.2) dt = 0.2;

  if (!gameOver && currentMap) {
    resources = Math.min(RESOURCE_CAP, resources + RESOURCE_REGEN * dt);

    waveCountdown -= dt;
    // Alert at 10s — pick direction then
    if (!alertTriggered && waveCountdown <= 10 && waveCountdown > 0) {
      alertTriggered = true;
      const dirs = currentMap.waveDirections;
      nextWaveDir = dirs[Math.floor(Math.random() * dirs.length)];
      const dirLabel = nextWaveDir === 'north' ? 'NORD' : 'SUD';
      flashMessage(`⚠️ ALERTE — front ${dirLabel} ⚠️`, 2500);
      document.body.style.animation = 'alertFlash 0.5s ease-in-out 3';
      setTimeout(() => document.body.style.animation = '', 2000);
    }
    if (waveCountdown <= 0) {
      spawnWave();
      alertTriggered = false;
      const baseInterval = WAVE_INTERVAL_MIN + Math.random() * (WAVE_INTERVAL_MAX - WAVE_INTERVAL_MIN);
      waveCountdown = Math.max(8, baseInterval - waveNumber * 0.5);
    }

    updateWaves(dt);

    // Cars
    for (const car of cars) {
      const road = roadPaths[car.roadIdx];
      const len = Math.hypot(road.x2 - road.x1, road.z2 - road.z1);
      car.t += (car.speed / len) * car.direction * dt;
      if (car.t > 1) car.t -= 1;
      if (car.t < 0) car.t += 1;
      car.group.position.x = road.x1 + (road.x2 - road.x1) * car.t;
      car.group.position.z = road.z1 + (road.z2 - road.z1) * car.t;
      car.group.rotation.y = car.direction > 0
        ? Math.atan2(road.x2 - road.x1, road.z2 - road.z1)
        : Math.atan2(road.x1 - road.x2, road.z1 - road.z2);
    }

    // Pedestrians
    for (const ped of pedestrians) {
      const road = roadPaths[ped.roadIdx];
      const dx = road.x2 - road.x1, dz = road.z2 - road.z1;
      const len = Math.hypot(dx, dz);
      const angle = Math.atan2(dx, dz);
      ped.t += (ped.speed / len) * ped.direction * dt;
      if (ped.t > 1) ped.t -= 1;
      if (ped.t < 0) ped.t += 1;
      const offX = Math.cos(angle) * 1.1 * ped.side;
      const offZ = -Math.sin(angle) * 1.1 * ped.side;
      ped.group.position.x = road.x1 + dx * ped.t + offX;
      ped.group.position.z = road.z1 + dz * ped.t + offZ;
      ped.group.rotation.y = ped.direction > 0 ? angle : angle + Math.PI;
    }

    // Particles
    for (const p of particlePool) {
      if (p.life <= 0) { p.mesh.visible = false; continue; }
      p.life -= dt;
      p.mesh.position.y += p.vy * dt;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.z += p.vz * dt;
      p.vy -= (p.type === 'spray' ? 1.5 : 8) * dt;
      const ratio = Math.max(0, p.life / p.maxLife);
      p.mesh.scale.setScalar(Math.max(0.1, ratio));
      if (p.mesh.material.opacity !== undefined) p.mesh.material.opacity = ratio * 0.7;
      if (p.life <= 0) p.mesh.visible = false;
    }

    // Game over check
    const alive = buildings.filter(b => b.alive).length;
    if (alive <= 5) {
      gameOver = true;
      flashMessage(alive === 0 ? '💀 Ville détruite !' : `🏚️ Seulement ${alive} bâtiments sauvés...`, 0);
      $message.classList.add('show');
      $gameoverPanel.classList.add('visible');
    }

    animateOcean(now);
    updateHUD();
    $waveTimer.textContent = Math.ceil(Math.max(0, waveCountdown));
  }

  controls.update();
  renderer.render(scene, camera);
}

// ─── Restart (same map) ────────────────────────────────────
window.restartGame = function() {
  if (!currentMap) return;

  // Clean gameplay objects (walls, trenches, waves, particles)
  walls.forEach(w => {
    scene.remove(w.group);
    w.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
  });
  walls = [];
  trenches.forEach(t => { scene.remove(t.mesh); t.mesh.geometry.dispose(); t.mesh.material.dispose(); });
  trenches = [];
  waves.forEach(w => {
    w.segMeshes.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  });
  waves = [];
  particlePool.forEach(p => { scene.remove(p.mesh); p.mesh.geometry?.dispose(); p.mesh.material?.dispose(); });
  particlePool = [];

  $message.classList.remove('show');
  $gameoverPanel.classList.remove('visible');

  generateMap(currentMap);
};

// ─── Go to menu ─────────────────────────────────────────────
window.goToMenu = function() {
  // Full cleanup
  walls.forEach(w => {
    scene.remove(w.group);
    w.group.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
  });
  walls = [];
  trenches.forEach(t => { scene.remove(t.mesh); t.mesh.geometry.dispose(); t.mesh.material.dispose(); });
  trenches = [];
  waves.forEach(w => {
    w.segMeshes.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  });
  waves = [];
  particlePool.forEach(p => { scene.remove(p.mesh); p.mesh.geometry?.dispose(); p.mesh.material?.dispose(); });
  particlePool = [];

  // Dispose entire map group
  disposeGroup(mapGroup);
  scene.remove(mapGroup);
  mapGroup = new THREE.Group();
  scene.add(mapGroup);
  cityGroup = new THREE.Group();
  mapGroup.add(cityGroup);
  oceanGroup = new THREE.Group();
  mapGroup.add(oceanGroup);
  oceanPlanes = [];
  cars = [];
  roadPaths = [];
  pedestrians = [];
  buildings = [];
  currentMap = null;
  gameOver = true; // pause loop

  ghostGroup.visible = false;
  $message.classList.remove('show');
  $gameoverPanel.classList.remove('visible');
  $hud.classList.remove('visible');
  $controls.classList.remove('visible');
  $homeScreen.classList.remove('hidden');
};

// ─── Start game on a map ────────────────────────────────────
function startGame(mapId) {
  const map = MAPS[mapId];
  if (!map) return;

  $homeScreen.classList.add('hidden');
  $hud.classList.add('visible');
  $controls.classList.add('visible');
  $gameoverPanel.classList.remove('visible');
  $message.classList.remove('show');
  gameOver = false;

  generateMap(map);
}

// ─── Build home screen cards ────────────────────────────────
function buildHomeScreen() {
  $mapCards.innerHTML = '';
  for (const [id, map] of Object.entries(MAPS)) {
    const card = document.createElement('div');
    card.className = 'map-card';
    card.innerHTML = `
      <h3>${map.name}</h3>
      <div class="diff">${map.difficulty}</div>
      <div class="desc">${map.description}</div>
      <div class="hint">Cliquez pour jouer</div>
    `;
    card.addEventListener('click', () => startGame(id));
    $mapCards.appendChild(card);
  }
}

// ─── Resize ─────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Keyboard shortcuts ─────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (currentMap) restartGame();
    return;
  }
  if (e.key === 'm' || e.key === 'M') {
    goToMenu();
    return;
  }
  if (!currentMap || gameOver) return;
  if (e.key === '1') { currentTier = 1; trenchMode = false; flashMessage('🧱 Sac de sable (10☼)', 800); updateHUD(); }
  if (e.key === '2') { currentTier = 2; trenchMode = false; flashMessage('🛡️ Renforcé (25☼)', 800); updateHUD(); }
  if (e.key === '3') { currentTier = 3; trenchMode = false; flashMessage('🧱 Béton (50☼)', 800); updateHUD(); }
  if (e.key === 't' || e.key === 'T') { trenchMode = !trenchMode; flashMessage(trenchMode ? '🕳️ Mode tranchée (5☼)' : '🧱 Mode mur', 800); updateHUD(); }
});

// ─── Start ──────────────────────────────────────────────────
buildHomeScreen();
gameLoop();

console.log('  🗺️  Cartes : ' + Object.keys(MAPS).join(', '));
console.log('  🖱️ Clic = placer | ⌨️ 1/2/3 = tier mur | T = tranchée | R = recommencer | M = menu');
</script>
