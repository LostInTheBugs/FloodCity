<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flood City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 16px; left: 16px;
    color: white; z-index: 10;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  }
  #hud h1 { font-size: 1.8em; margin-bottom: 4px; letter-spacing: 2px; }
  #hud .stat { font-size: 1.1em; margin: 2px 0; }
  #hud .stat span { font-weight: bold; color: #ffd700; }

  #message {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: white; font-size: 2.5em; font-weight: bold; z-index: 20;
    text-align: center; pointer-events: none;
    text-shadow: 0 0 20px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity 0.4s;
  }
  #message.show { opacity: 1; }

  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 0.85em;
    z-index: 10; pointer-events: none;
    text-align: center;
  }
  #controls kbd {
    background: rgba(255,255,255,0.15);
    padding: 2px 7px; border-radius: 4px;
    margin: 0 2px;
  }

  #restart-btn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, 80px);
    padding: 12px 36px; font-size: 1.2em;
    background: #ff6b35; color: white; border: none;
    border-radius: 8px; cursor: pointer; z-index: 25;
    display: none; font-weight: bold;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #restart-btn:hover { transform: translate(-50%, 80px) scale(1.05); }
  #restart-btn.visible { display: block; }
</style>
</head>
<body>

<div id="hud">
  <h1>🌊 FLOOD CITY</h1>
  <div class="stat">🏗️ Bâtiments : <span id="buildings-count">0</span></div>
  <div class="stat">💰 Ressources : <span id="resources">100</span></div>
  <div class="stat">📦 Murs : <span id="walls-count">0</span></div>
  <div class="stat">🌊 Vague dans : <span id="wave-timer">--</span></div>
  <div class="stat">⭐ Score : <span id="score">0</span></div>
</div>

<div id="message"></div>
<button id="restart-btn" onclick="restartGame()">🔄 Rejouer</button>

<div id="controls">
  🖱️ <kbd>Clic gauche</kbd> Placer un mur &nbsp;|&nbsp;
  🖱️ <kbd>Clic droit</kbd> Tourner &nbsp;|&nbsp;
  🖱️ <kbd>Molette</kbd> Zoom
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── DOM refs ──────────────────────────────────────────────
const $buildings = document.getElementById('buildings-count');
const $resources = document.getElementById('resources');
const $wallsCount = document.getElementById('walls-count');
const $waveTimer = document.getElementById('wave-timer');
const $score = document.getElementById('score');
const $message = document.getElementById('message');
const $restart = document.getElementById('restart-btn');

// ─── Three.js setup ─────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 90);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 150);
camera.position.set(22, 18, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI / 2 + 0.3;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.update();

// ─── Lighting ───────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x8899cc, 1.2);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 3.5);
sun.position.set(30, 40, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = -35; sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35; sun.shadow.camera.bottom = -35;
sun.shadow.bias = -0.0004;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3d5a3d, 0.6);
scene.add(hemi);

// ─── Ground ─────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x5a8f3c, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper for orientation
const grid = new THREE.GridHelper(40, 20, 0x3d6b2e, 0x4a7a35);
grid.position.y = 0.01;
scene.add(grid);

// ─── Ocean ──────────────────────────────────────────────────
const oceanGeo = new THREE.PlaneGeometry(44, 12, 40, 12);
const oceanMat = new THREE.MeshStandardMaterial({
  color: 0x1a5c8a, roughness: 0.3, metalness: 0.6,
  transparent: true, opacity: 0.85
});
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x = -Math.PI / 2;
ocean.position.set(0, 0.08, -21);
ocean.receiveShadow = true;
scene.add(ocean);

// Ocean border/beach
const beachGeo = new THREE.PlaneGeometry(40, 3);
const beachMat = new THREE.MeshStandardMaterial({ color: 0xd4b886, roughness: 0.95 });
const beach = new THREE.Mesh(beachGeo, beachMat);
beach.rotation.x = -Math.PI / 2;
beach.position.set(0, 0.02, -14);
beach.receiveShadow = true;
scene.add(beach);

// ─── Data ───────────────────────────────────────────────────
const WALL_COST = 10;
const RESOURCE_REGEN = 0.3; // per second
const WAVE_INTERVAL_MIN = 14; // seconds between waves
const WAVE_INTERVAL_MAX = 22;
const TERRAIN_HALF = 17; // half of usable terrain area

let resources = 150;
let score = 0;
let buildings = [];
let walls = [];
let waves = [];
let gameOver = false;
let waveCountdown = 20; // generous first wave timer
let waveNumber = 0;
let lastWaveTime = performance.now() / 1000;

// Building palette
const BUILDING_COLORS = [
  0xd4a574, 0xc4956a, 0xb8865e, 0xe8c9a0, 0xdbb88c,
  0x8cb4d4, 0x7aa3c0, 0x9fc5e8, 0x6d9ab8, 0xb0d4e8,
  0xc9c9c9, 0xb8b8b8, 0xa0a0a0, 0xd0d0d0, 0xbfbfbf,
  0xe8d5b7, 0xd4c4a8, 0xc8b898, 0xf0dcc0, 0xdcc8a8
];

// ─── Building creation ──────────────────────────────────────
function createBuilding(x, z, w, d, h, color) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  // Rooftop accent
  if (h > 2.5) {
    const roofGeo = new THREE.CylinderGeometry(0.15, 0.15, h * 0.15, 8);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.6 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.set(x, h + h * 0.075, z);
    roof.castShadow = true;
    scene.add(roof);
  }

  return { mesh, x, z, w, d, h, alive: true };
}

function generateCity() {
  // Clear existing
  buildings.forEach(b => {
    scene.remove(b.mesh);
    if (b.mesh.material) b.mesh.material.dispose();
    b.mesh.geometry.dispose();
  });
  buildings = [];

  const count = 25;
  const placed = [];
  const minDist = 2.5;

  for (let i = 0; i < count; i++) {
    let attempts = 0;
    let x, z;
    do {
      x = (Math.random() - 0.5) * (TERRAIN_HALF * 2 - 4);
      z = (Math.random() - 0.5) * (TERRAIN_HALF * 2 - 6) + 1; // bias away from ocean
      attempts++;
    } while (attempts < 50 && placed.some(p => Math.hypot(p.x - x, p.z - z) < minDist));

    const w = 0.8 + Math.random() * 1.4;
    const d = 0.8 + Math.random() * 1.4;
    const h = 1.5 + Math.random() * 4.5;
    const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];

    const building = createBuilding(x, z, w, d, h, color);
    buildings.push(building);
    placed.push({ x, z });
  }

  // Add a few larger "downtown" buildings
  for (let i = 0; i < 5; i++) {
    const x = -6 + i * 3;
    const z = 3 + Math.random() * 4;
    const w = 1.5 + Math.random() * 0.8;
    const d = 1.5 + Math.random() * 0.8;
    const h = 5 + Math.random() * 6;
    const color = 0x8899bb + Math.floor(Math.random() * 0x111122);
    const building = createBuilding(x, z, w, d, h, color);
    buildings.push(building);
  }

  updateHUD();
}

// ─── Wall placement ─────────────────────────────────────────
function placeWall(worldPos) {
  if (gameOver) return false;
  if (resources < WALL_COST) {
    flashMessage('Pas assez de ressources !');
    return false;
  }

  // Check bounds
  if (Math.abs(worldPos.x) > TERRAIN_HALF || Math.abs(worldPos.z) > TERRAIN_HALF) return false;
  // Don't place in ocean
  if (worldPos.z < -TERRAIN_HALF + 2) return false;

  const geo = new THREE.BoxGeometry(1.2, 0.7, 0.5);
  const mat = new THREE.MeshStandardMaterial({ color: 0xc4a265, roughness: 0.85, metalness: 0.05 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(worldPos.x, 0.35, worldPos.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const wall = {
    mesh,
    x: worldPos.x,
    z: worldPos.z,
    hp: 100,
    maxHp: 100,
  };
  walls.push(wall);

  resources -= WALL_COST;
  updateHUD();
  return true;
}

// ─── Wave system ────────────────────────────────────────────
function spawnWave() {
  if (gameOver) return;

  waveNumber++;
  const difficulty = Math.min(waveNumber / 5, 1); // 0→1 over first 5 waves, then capped
  const waveWidth = 6 + Math.random() * (8 + difficulty * 18); // width grows with difficulty
  const waveH = 1.5 + difficulty * 5; // height scales 1.5 → 6.5
  const speed = 3 + difficulty * 4;  // 3 → 7

  const geo = new THREE.BoxGeometry(waveWidth, waveH, 2);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x3377bb, roughness: 0.2, metalness: 0.4,
    transparent: true, opacity: 0.7
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, waveH / 2, -TERRAIN_HALF);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const baseHp = 80 + difficulty * 200; // 80 → 280
  waves.push({
    mesh,
    hp: baseHp,
    maxHp: baseHp,
    speed: speed,
    z: -TERRAIN_HALF,
    width: waveWidth,
    height: waveH,
    destroyedBuildings: 0,
  });

  flashMessage(`🌊 Vague #${waveNumber} !`, 1500);
}

function updateWaves(dt) {
  for (let wi = waves.length - 1; wi >= 0; wi--) {
    const wave = waves[wi];
    wave.z += wave.speed * dt;
    wave.mesh.position.z = wave.z;
    wave.mesh.position.y = wave.height / 2;

    // Scale wave down as it loses HP
    const hpRatio = wave.hp / wave.maxHp;
    const currentScale = 0.3 + hpRatio * 0.7;
    wave.mesh.scale.set(currentScale, currentScale * 0.8 + 0.2, 1);
    wave.mesh.material.opacity = 0.3 + hpRatio * 0.4;

    // Check collisions with walls
    for (let i = walls.length - 1; i >= 0; i--) {
      const wall = walls[i];
      if (Math.abs(wall.z - wave.z) < 1.5 && Math.abs(wall.x) < wave.width / 2 * currentScale + 0.6) {
        // Wall blocks wave
        const dmg = 30 * dt;
        wall.hp -= dmg;
        wave.hp -= dmg * 1.5;

        // Update wall appearance
        const wallHpRatio = Math.max(0, wall.hp / wall.maxHp);
        wall.mesh.material.color.setHex(
          wallHpRatio > 0.5 ? 0xc4a265 :
          wallHpRatio > 0.25 ? 0xb8954a : 0x8a5a2a
        );
        wall.mesh.scale.y = Math.max(0.2, wallHpRatio);

        if (wall.hp <= 0) {
          scene.remove(wall.mesh);
          wall.mesh.geometry.dispose();
          wall.mesh.material.dispose();
          walls.splice(i, 1);
        }
      }
    }

    // Check collisions with buildings
    for (const building of buildings) {
      if (!building.alive) continue;
      if (Math.abs(building.z - wave.z) < 2 &&
          Math.abs(building.x) < wave.width / 2 * currentScale + building.w / 2) {
        // Building hit!
        wave.hp -= building.h * 8;
        building.alive = false;
        scene.remove(building.mesh);
        building.mesh.geometry.dispose();
        building.mesh.material.dispose();
        wave.destroyedBuildings++;

        // Smoke particles
        spawnDestroyParticles(building.x, building.h, building.z);
      }
    }

    // Remove wave if it passes through or dies
    if (wave.z > TERRAIN_HALF + 5 || wave.hp <= 0) {
      scene.remove(wave.mesh);
      wave.mesh.geometry.dispose();
      wave.mesh.material.dispose();
      waves.splice(wi, 1);
    }
  }
}

// ─── Destruction particles ──────────────────────────────────
function spawnDestroyParticles(x, y, z) {
  const count = 12;
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const mat = new THREE.MeshStandardMaterial({ color: 0x998877, roughness: 0.8 });
    const piece = new THREE.Mesh(geo, mat);
    piece.position.set(
      x + (Math.random() - 0.5) * 2,
      y + Math.random() * 2,
      z + (Math.random() - 0.5) * 2
    );
    piece.userData = {
      vy: 3 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 3,
      vz: (Math.random() - 0.5) * 3,
      life: 1.2 + Math.random() * 0.8
    };
    group.add(piece);
  }
  scene.add(group);

  // Auto-remove after animation
  const removeTime = performance.now() / 1000 + 2;
  function animateParticles() {
    const now = performance.now() / 1000;
    if (now > removeTime) {
      group.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
      scene.remove(group);
      return;
    }
    const dt2 = Math.min(0.05, 1 / 60);
    for (const piece of group.children) {
      piece.position.y += piece.userData.vy * dt2;
      piece.position.x += piece.userData.vx * dt2;
      piece.position.z += piece.userData.vz * dt2;
      piece.userData.vy -= 8 * dt2;
      piece.userData.life -= dt2;
      piece.scale.setScalar(Math.max(0, piece.userData.life / 1.2));
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
}

// ─── Water animation ────────────────────────────────────────
function animateOcean(time) {
  const positions = oceanGeo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = 0.15 * Math.sin(x * 1.3 + time * 1.8) * Math.cos(y * 1.7 + time * 1.5)
            + 0.1 * Math.sin(x * 2.5 + time * 2.3) * Math.sin(y * 2.1 - time * 1.2);
    positions.setZ(i, z);
  }
  positions.needsUpdate = true;
}

// ─── HUD ────────────────────────────────────────────────────
function updateHUD() {
  const alive = buildings.filter(b => b.alive).length;
  $buildings.textContent = alive;
  $resources.textContent = Math.floor(resources);
  $wallsCount.textContent = walls.length;
  $score.textContent = score;
}

function flashMessage(text, duration = 2000) {
  $message.textContent = text;
  $message.classList.add('show');
  clearTimeout($message._timeout);
  $message._timeout = setTimeout(() => $message.classList.remove('show'), duration);
}

// ─── Raycaster for click placement ──────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

renderer.domElement.addEventListener('click', (e) => {
  if (gameOver) return;

  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersection = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, intersection);

  if (intersection) {
    const snapped = new THREE.Vector3(
      Math.round(intersection.x * 2) / 2, // snap to half-unit grid
      0,
      Math.round(intersection.z * 2) / 2
    );
    placeWall(snapped);
  }
});

// ─── Game loop ──────────────────────────────────────────────
let lastFrameTime = performance.now() / 1000;

function gameLoop() {
  requestAnimationFrame(gameLoop);

  const now = performance.now() / 1000;
  let dt = now - lastFrameTime;
  lastFrameTime = now;
  if (dt > 0.2) dt = 0.2; // clamp

  if (!gameOver) {
    // Resource regen
    resources = Math.min(200, resources + RESOURCE_REGEN * dt);

    // Wave countdown
    waveCountdown -= dt;
    if (waveCountdown <= 0) {
      spawnWave();
      // Intervals get slightly shorter as game progresses
      const baseInterval = WAVE_INTERVAL_MIN + Math.random() * (WAVE_INTERVAL_MAX - WAVE_INTERVAL_MIN);
      waveCountdown = Math.max(8, baseInterval - waveNumber * 0.5);
    }

    // Update waves
    updateWaves(dt);

    // Check game over
    const alive = buildings.filter(b => b.alive).length;
    score = alive;
    if (alive <= 5) {
      gameOver = true;
      flashMessage(alive === 0 ? '💀 Ville détruite !' : `🏚️ Seulement ${alive} bâtiments sauvés...`, 0);
      $message.classList.add('show');
      $restart.classList.add('visible');
    }

    // Animate ocean
    animateOcean(now);

    updateHUD();
    $waveTimer.textContent = Math.ceil(Math.max(0, waveCountdown));
  }

  controls.update();
  renderer.render(scene, camera);
}

// ─── Restart ────────────────────────────────────────────────
window.restartGame = function() {
  // Clean walls
  walls.forEach(w => {
    scene.remove(w.mesh);
    w.mesh.geometry.dispose();
    w.mesh.material.dispose();
  });
  walls = [];

  // Clean waves
  waves.forEach(w => {
    scene.remove(w.mesh);
    w.mesh.geometry.dispose();
    w.mesh.material.dispose();
  });
  waves = [];

  // Reset state
  resources = 150;
  score = 0;
  gameOver = false;
  waveCountdown = 15; // slightly faster on restart
  waveNumber = 0;
  lastWaveTime = performance.now() / 1000;

  $message.classList.remove('show');
  $restart.classList.remove('visible');

  generateCity();
  updateHUD();
};

// ─── Resize ─────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Keyboard shortcuts ─────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    restartGame();
  }
});

// ─── Start ──────────────────────────────────────────────────
generateCity();
gameLoop();

console.log('🌊 Flood City — prêt !');
console.log('  🖱️ Clic gauche = placer un mur (coût: 10 ressources)');
console.log('  🖱️ Clic droit = tourner la caméra');
console.log('  ⌨️  R = recommencer');
</script>
</body>
</html>
